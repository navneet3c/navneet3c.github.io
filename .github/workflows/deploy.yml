# Builds HomeRow and publishes dist/ to the gh-pages branch.
#
# One-time setup: GitHub repo → Settings → Pages → Build and deployment
# → Source: Deploy from a branch → Branch: gh-pages → / (root)
#
# (If Source is set to "main" / root, the site serves raw .jsx and will break.)

name: Deploy HomeRow to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
